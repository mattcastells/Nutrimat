name: CI

# Se corre en cada push a main y en cada pull request. Lo mismo que se corre a
# mano antes de un release, para que un tag nunca sea la primera vez que algo
# se verifica.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos verificando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura, explícito. Sin este bloque el token queda con el default del
# repositorio —que en repos personales suele ser lectura **y escritura**—, y
# entonces cualquier paso comprometido puede escribir en el repo o publicar un
# release desde un simple push. Ninguno de los tres jobs de acá necesita
# escribir nada: analizan, prueban y apagan.
permissions:
  contents: read

# Las actions van clavadas a su commit y no a su tag.
#
# Un tag es mutable: `@v4` lo puede reapuntar quien controle ese repositorio, y
# ya pasó de verdad (tj-actions, 2025). Acá la diferencia no es teórica —
# `release.yml` maneja el keystore de firma, y si ese archivo se filtra no se
# puede volver a publicar una actualización de esta app **nunca más**.
#
# El comentario al lado del SHA es la versión que corresponde, y es lo que deja
# que Dependabot los mantenga al día sin perder el pin.

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  secrets:
    name: Escanear secretos filtrados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # docs/handoff/20-environment-variables.md §5 dice que esto ya corría;
      # no era cierto. Gratis para un repo público, sin licencia que configurar.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: Analizar y probar la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # `--fatal-infos` porque el proyecto está limpio hoy: dejar que se
      # acumulen "info" es cómo se llega a un analyze que nadie mira.
      - name: Analizar
        run: flutter analyze --fatal-infos

      # No hay control de `dart format`: el estilo "tall" que trae Dart 3.7+
      # reescribiría 62 de los 100 archivos. Si algún día se quiere adoptar, es
      # un `dart format .` en un commit aparte y después se agrega el paso —
      # pero mezclarlo con cambios reales vuelve ilegible cualquier diff.
      - name: Tests
        run: flutter test

  functions:
    name: Compilar las Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nada en el pipeline compilaba las funciones: un error de sintaxis
      # aparecía recién al desplegar, y desplegar es manual. Pasó con una
      # concatenación implícita de strings —`'a' 'b'`, que en Dart une y en
      # TypeScript es un error— que tumbó dos de las tres funciones.
      #
      # `esbuild` no las ejecuta ni resuelve los imports de `jsr:`, pero parsea
      # todo el árbol de módulos, que es lo que hace falta para atajar esto.
      - name: Verificar que parsean
        run: |
          fallo=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ -f "$dir/index.ts" ] || continue
            echo "· $name"
            if ! npx --yes esbuild@0.24.0 --bundle "$dir/index.ts" \
              --format=esm --platform=neutral --external:jsr:* \
              --outfile=/dev/null; then
              echo "::error::La función $name no compila."
              fallo=1
            fi
          done
          exit $fallo

  database:
    name: Probar las políticas RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.110.0

      # Levanta Postgres y aplica las 32 migraciones desde cero: si una
      # migración no corre en una base limpia, acá se ve.
      #
      # `storage-api` ya no se excluye: la migración 18 crea los buckets y
      # storage_test.sql verifica sus políticas.
      - name: Levantar el stack local
        run: supabase start --exclude realtime,imgproxy,studio,edge-runtime

      - name: Suite pgTAP
        run: supabase test db

      - name: Apagar
        if: always()
        run: supabase stop --no-backup
