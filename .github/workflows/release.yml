name: Release

# Publicar una versión es empujar un tag:
#
#     # 1. subir la versión en pubspec.yaml (ej. 1.1.0+2) y commitear
#     # 2. git tag v1.1.0 && git push origin v1.1.0
#
# Este workflow compila el APK firmado y crea el release de GitHub. El
# `nutrimat-<version>-universal.apk` es el que descarga Configuración →
# Actualizaciones dentro de la app: si cambia ese nombre, el updater deja de
# encontrarlo.
on:
  push:
    tags: ['v*']

# Necesario para crear el release y subirle los APKs.
permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.35.7

jobs:
  release:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # El tag manda sobre el nombre del release, pero la versión que queda
      # dentro del APK sale de pubspec.yaml. Si no coinciden, la app instalada
      # se compara mal contra el release y el updater se vuelve loco: mejor
      # fallar acá que publicar algo incoherente.
      - name: Verificar que el tag coincide con pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)"
          echo "tag=$tag  pubspec=$pubspec"
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::El tag v$tag no coincide con la versión $pubspec de pubspec.yaml."
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: flutter pub get

      # Se repite lo de CI a propósito: un tag puede apuntar a un commit que
      # nunca pasó por un pull request.
      - name: Analizar
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

      # Y las otras dos mitades de CI, por lo mismo: un tag puede apuntar a un
      # commit que nunca pasó por un pull request, y hasta acá el release solo
      # repetía `analyze` y `flutter test`. Una migración que no corre en una
      # base limpia, o una Edge Function que no parsea, se publicaban igual y
      # aparecían recién al desplegar a mano.
      - name: Verificar que las Edge Functions parsean
        run: |
          fallo=0
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ -f "$dir/index.ts" ] || continue
            echo "· $name"
            if ! npx --yes esbuild@0.24.0 --bundle "$dir/index.ts" \
              --format=esm --platform=neutral --external:jsr:* \
              --outfile=/dev/null; then
              echo "::error::La función $name no compila."
              fallo=1
            fi
          done
          exit $fallo

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0

      - name: Migraciones y suite pgTAP desde cero
        run: |
          supabase start --exclude realtime,imgproxy,studio,edge-runtime
          supabase test db

      - name: Apagar el stack
        if: always()
        run: supabase stop --no-backup

      # El keystore vive solo en los secretos del repositorio. Nunca se
      # commitea: si se pierde, no se puede volver a publicar una actualización
      # de esta app jamás — Android exige que todas las versiones estén
      # firmadas con la misma clave.
      - name: Restaurar el keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Ver docs/releases.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/nutrimat-upload.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=nutrimat-upload.jks
          PROPS

      # La conexión a Supabase se compila dentro del APK. Sin estos valores la
      # app igual arranca, pero en modo local: los datos no salen del teléfono
      # y no se puede iniciar sesión. Mejor fallar acá que publicar un release
      # que instala bien y no deja entrar.
      - name: Armar la configuración de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_PUBLISHABLE_KEY. Ver docs/releases.md."
            exit 1
          fi
          mkdir -p env
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' \
            > env/ci.json

      # El universal anda en cualquier teléfono; es el que instala el updater,
      # porque elegir por ABI exigiría conocer la arquitectura del dispositivo.
      - name: Compilar el APK universal
        run: flutter build apk --release --dart-define-from-file=env/ci.json

      # Ya no se publican APK por arquitectura.
      #
      # Pesaban menos, pero `--split-per-abi` le suma a cada uno un
      # corrimiento por ABI en el versionCode (arm64 → 2011 cuando el
      # universal era 11). Como el updater baja siempre el universal, quien
      # instalaba el de su arquitectura quedaba con un código más alto y
      # Android le rechazaba toda actualización posterior por downgrade: "No
      # se instaló la app", sin salida más que desinstalar y perder los datos.
      #
      # Un solo APK no puede tener ese problema. Si algún día vuelven los
      # chicos, primero hay que hacer que el updater elija el de la
      # arquitectura del teléfono, no después.
      - name: Juntar los artefactos
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/nutrimat-$VERSION-universal.apk"
          ls -lh dist

      # Todos los APK del release tienen que declarar el MISMO versionCode, y
      # tiene que ser el de pubspec.yaml.
      #
      # Con `--split-per-abi` el plugin de Flutter le suma un corrimiento por
      # arquitectura, y como el updater baja siempre el universal, quien había
      # instalado el de su ABI quedaba con un versionCode más alto y Android
      # le rechazaba la actualización por downgrade: "No se instaló la app",
      # sin salida más que desinstalar. `android/app/build.gradle.kts` anula
      # ese corrimiento; esto verifica que siga anulado.
      - name: Verificar que los versionCode coincidan
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          esperado="$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//')"
          echo "versionCode esperado: $esperado"

          fallo=0
          for apk in dist/*.apk; do
            code=$("$aapt2" dump badging "$apk" \
              | head -1 | sed "s/.*versionCode='\([0-9]*\)'.*/\1/")
            echo "  $(basename "$apk"): $code"
            if [ "$code" != "$esperado" ]; then
              echo "::error::$(basename "$apk") declara versionCode $code y debería ser $esperado."
              fallo=1
            fi
          done

          if [ "$fallo" != 0 ]; then
            echo "::error::Los APK no comparten versionCode. Publicarlos así deja sin actualizar a quien tenga el más alto."
            exit 1
          fi

      # Deja constancia de con qué clave quedó firmado: si algún día un APK no
      # instala encima de otro, esto es lo segundo que hay que mirar (lo
      # primero es el versionCode de acá arriba).
      #
      # El runner trae varias versiones de build-tools, así que el glob se
      # resuelve a una sola: sin esto, la segunda ruta que expande el shell le
      # llega como argumento a la primera y apksigner corta con "Unsupported
      # command".
      - name: Verificar la firma
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Usando $apksigner"
          "$apksigner" verify --print-certs "dist/nutrimat-$VERSION-universal.apk"

      - name: Borrar las credenciales del runner
        if: always()
        run: rm -f android/nutrimat-upload.jks android/key.properties env/ci.json

      # `--notes` se antepone a lo que genera `--generate-notes`, así que la
      # explicación de qué archivo bajar queda arriba del changelog.
      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **nutrimat-$VERSION-universal.apk** anda en cualquier teléfono.

          Desde una versión ya instalada no hace falta bajar nada a mano:
          **Configuración → Actualizaciones**.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Nutrimat $VERSION" \
            --generate-notes \
            --notes-file notes.md
