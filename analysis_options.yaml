# Análisis estático de Nutrimat.
#
# 19-project-structure.md pide además un lint de capas (`import_lint`) que
# falle el build si `domain/` importa Flutter o si `presentation/` importa
# `data/`. Queda pendiente de incorporar; mientras tanto la regla se sostiene
# por revisión: las únicas dependencias permitidas son
#   presentation ──► domain ◄── data
# y `presentation/` solo conoce las interfaces de `domain/repositories/`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
  errors:
    # Los tokens generados no se editan a mano; el resto es error real.
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
