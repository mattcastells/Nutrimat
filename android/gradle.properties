org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# El proyecto vive en D: y el caché de paquetes de pub en C:. El compilador
# incremental de Kotlin no tolera esa mezcla de raíces en Windows y corta el
# build de los plugins con "this and base files have different roots".
# Apagarlo cuesta unos segundos por build y evita el problema por completo.
kotlin.incremental=false
