name: nutrimat
description: "Nutrimat — registro de alimentación, actividad física y peso corporal."
publish_to: 'none'
# El build number (lo que va después del `+`) es el versionCode de Android y
# **solo puede crecer**: si baja, el teléfono se niega a instalar encima.
#
# Arranca en 5000 y no en 12 porque las versiones 1.3.0 y 1.3.1 publicaron
# APK por arquitectura con el corrimiento de Flutter, y el más alto que quedó
# instalado fue 4011 (x86_64). Cualquier número por debajo de eso deja a esa
# gente sin poder actualizar nunca más desde la app.
version: 1.14.3+5021

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado (13-state-management.md §1)
  flutter_riverpod: ^2.6.1

  # Navegación (02-information-architecture.md)
  go_router: ^14.6.2

  # Iconografía del sistema de diseño (06-design-tokens.md §4)
  phosphor_flutter: ^2.1.0

  # Utilidades
  intl: ^0.20.2
  uuid: ^4.5.1
  # Para volver a codificar a JPEG la foto que `image_picker` devolvió en PNG.
  # Ver `data/local/photo_normalizer.dart`: es un caso raro y caro.
  image: ^4.5.4
  collection: ^1.19.0
  # SHA-256 del APK descargado contra el digest que publica GitHub
  # (`data/remote/github_releases_client.dart`). Ya venía como transitiva; se
  # declara porque ahora se importa directo.
  crypto: ^3.0.6
  shared_preferences: ^2.3.3
  image_picker: ^1.2.2
  http: ^1.6.0
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  supabase_flutter: ^2.16.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Ícono adaptativo de Android a partir de assets/brand/ (ver "Nutrimat Logo").
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: ic_launcher
  ios: false
  image_path: assets/brand/icon-512.png
  adaptive_icon_background: assets/brand/adaptive-background.png
  adaptive_icon_foreground: assets/brand/adaptive-foreground.png
  adaptive_icon_monochrome: assets/brand/monochrome.png
  # El mismo que `android/app/build.gradle.kts`; tenerlos distintos hacía que
  # el generador de íconos creara variantes para una API que la app ya no
  # soporta.
  min_sdk_android: 26

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/mock/
    # Tabla de composición de alimentos argentinos (ARGENFOODS, UNLu).
    - assets/data/

  # Familia única: Inter (06-design-tokens.md §2).
  # Peso de títulos 500 — no se sube a 600/700.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
